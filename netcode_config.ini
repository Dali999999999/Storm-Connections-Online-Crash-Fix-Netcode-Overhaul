[General]
EnableConsole = 1
EnableFileLog = 1
EnableNetcodeOverhaul = 1

[CrashFix]
; Fixes deterministic 0xC0000005 online crashes at:
;   - NSUNSC.exe+0x010BAD24 & +0x0847A67 (SteamFriends017 SSE 4KB page over-read)
;   - NSUNSC.exe+0x010F1455 & +0x010F2928 (16-slot resend pool null-pointer SSE write)
FixOnlinePersonaCrash = 1

[InputDelay]
EnableCustomDelay = 1
; DelayMode:
;   1 = Smart Peer-Safe One-Way Delay (DEFAULT: negotiates reduced OWD delay via Host RTT
;       with automatic VSync-phase & route-jitter guard; 100% compatible with ALL opponents)
;   2 = Direct Modded-Peer Override (use only when both players share identical settings)
;   0 = Vanilla Delay (keeps Vanilla-Safe packet redundancy & crash fixes active)
DelayMode = 1
; ForcedDelayFrames: -1 = Adaptive One-Way Latency (RTT/2 + phase/route cushion), or 1..16 for fixed
ForcedDelayFrames = -1
; MinDelayFrames: Protocol mathematical minimum is 1 frame (16.67ms at 60 FPS)
MinDelayFrames = 1
; MaxDelayClamp: 16 allows smooth stall-free play even on 300ms+ transcontinental matches
MaxDelayClamp = 16
; JitterMarginMs: Phase-safe cushion (8ms + automatic RTT/12 long-haul route scaling)
JitterMarginMs = 8

[LowLatencyRender]
; Forces IDXGIDevice1::SetMaximumFrameLatency(1) + GPUThreadPriority(+5),
; eliminating ~33.3 ms (2 frames) of Windows default 3-frame DXGI render-queue lag.
EnableLowLatencyRender = 1
MaxFrameLatency = 1
; Disables Win11 EcoQoS/Timer-Coalescing, locks 1ms kernel timer & enables MMCSS 'Games' thread priority
EnableSchedulerBoost = 1

[PacketRedundancy]
; Vanilla-Lookahead-Safe multi-frame UDP redundancy + burst-loss window persistence.
; Validated against NSUNSC.exe+0x10F299B so unmodded opponents NEVER drop mixed-size packets.
EnablePacketRedundancy = 1
RedundancyFrameDepth = 3
MaxResendBatch = 3

[JitterAndStallGovernance]
; Prevents Windows 65-second Wi-Fi background channel scans & enables Media Streaming low-latency
; mode via Win32 wlanapi.dll while NSUNSC.exe is running (automatically restored on game exit).
EnableWifiGamingMode = 1
; Automatically adds +1/+2 frame cushion on rematches if a peer had >=3% / >=18% mid-fight stalls
EnableDynamicPeerAutoTune = 1
; Gentle dual-edge QPC poll (850us tick 0, 450us tick 1, 45us step) across 16.67ms VSync boundaries
EnableMicroJitterPoll = 1
MicroJitterSpinUs = 850
; Triggers accelerated NACK at 3 stalled frames (50ms) + single backup retry at 9 frames (150ms)
FastNackRecovery = 1
; Suppresses the intrusive dark 'Transmitting...' modal on brief spikes (< 180 frames / 3.0s)
SuppressShortOverlay = 1
OverlayThresholdFrames = 180
